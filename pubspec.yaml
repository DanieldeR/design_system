name: design_system
description: "A Flutter design system (tokens, theme, components) for web and Android."
version: 0.1.0
homepage:

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # Variable fonts — the same file is registered under multiple `weight`
  # entries so Flutter/Skia resolves each requested weight from the
  # font's own wght axis instead of collapsing everything to one static
  # weight. See lib/src/tokens/ds_typography.dart for where each weight
  # is used.
  fonts:
    - family: Playfair Display
      fonts:
        - asset: fonts/PlayfairDisplay-Variable.ttf
          weight: 600
        - asset: fonts/PlayfairDisplay-Variable.ttf
          weight: 700
        - asset: fonts/PlayfairDisplay-Variable.ttf
          weight: 900
        - asset: fonts/PlayfairDisplay-Italic-Variable.ttf
          weight: 600
          style: italic
    - family: IBM Plex Sans
      fonts:
        - asset: fonts/IBMPlexSans-Variable.ttf
          weight: 400
        - asset: fonts/IBMPlexSans-Variable.ttf
          weight: 500
        - asset: fonts/IBMPlexSans-Variable.ttf
          weight: 600
        - asset: fonts/IBMPlexSans-Variable.ttf
          weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
